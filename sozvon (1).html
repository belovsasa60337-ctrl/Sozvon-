<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Созвон</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg0:#000;--bg1:#0c0c0c;--bg2:#111;--bg3:#1c1c1c;--bg4:#2a2a2a;--hov:#181818;--txt:#e6e6e6;--mut:#8a8a8a;--head:#fff;--acc:#fff;--acc2:#d4d4d4;--ok:#3fb950;--idle:#d29922;--dnd:#e5484d;--off:#6b6b6b;--line:#ffffff14;--ment:#ffffff14;--inv:#000;--shadow:0 8px 24px #0006}
[data-theme=light]{--bg0:#f2f2f2;--bg1:#fafafa;--bg2:#fff;--bg3:#f0f0f0;--bg4:#dedede;--hov:#f3f3f3;--txt:#1a1a1a;--mut:#6b6b6b;--head:#000;--acc:#000;--acc2:#333;--inv:#fff;--ment:#0000000d;--line:#00000014;--line:#0000001a;--shadow:0 8px 24px #0002}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg0);color:var(--txt);font:15px/1.45 Manrope,"Nunito Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:#00a8fc;text-decoration:none}a:hover{text-decoration:underline}
svg{display:block;fill:currentColor}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#0005;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
input.f,textarea.f,select.f{width:100%;background:var(--bg0);border:1px solid transparent;border-radius:4px;padding:10px;outline:0;font-size:16px}
input.f:focus,textarea.f:focus{border-color:var(--acc)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.02em;margin:14px 0 6px}
.btn{background:var(--acc);color:#fff;border-radius:4px;padding:9px 16px;font-weight:600;min-height:38px}
.btn:hover{background:var(--acc2)}.btn.sec{background:var(--bg4);color:var(--txt)}.btn.red{background:var(--dnd)}.btn.grn{background:var(--ok)}.btn[disabled]{opacity:.5;cursor:default}
/* auth */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg0);padding:16px;z-index:50;overflow:auto}
.card{background:var(--bg2);border-radius:8px;padding:28px;width:100%;max-width:440px;box-shadow:var(--shadow)}
.card h1{text-align:center;margin:0 0 4px;font-size:24px;color:var(--head)}.card p.s{text-align:center;color:var(--mut);margin:0 0 14px}
.err{color:#fa777c;font-size:13px;min-height:18px;margin-top:8px}
/* layout */
#app{display:flex;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top)}
#nav{display:flex;flex:none;height:100%}
#rail{width:72px;background:var(--bg0);overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;scrollbar-width:none;flex:none}
#rail::-webkit-scrollbar{display:none}
.ri{position:relative;width:48px;height:48px;flex:none}
.ri .ic{width:48px;height:48px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:600;transition:.15s;color:var(--txt);cursor:pointer;font-size:15px}
.ri:hover .ic,.ri.on .ic{border-radius:16px;background:var(--acc);color:#fff}.ri.add .ic{color:var(--ok)}.ri.add:hover .ic{background:var(--ok);color:#fff}
.ri img{width:100%;height:100%;object-fit:cover}
.ri .pill{position:absolute;left:-12px;top:50%;width:4px;height:0;border-radius:0 4px 4px 0;background:var(--head);transform:translateY(-50%);transition:.15s}
.ri.unread .pill{height:8px}.ri:hover .pill{height:20px}.ri.on .pill{height:40px}
.bdg{position:absolute;right:-3px;bottom:-3px;background:var(--dnd);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:3px solid var(--bg0);box-sizing:content-box}
.rsep{width:32px;height:2px;background:var(--bg4);flex:none}
#side{width:240px;background:var(--bg1);display:flex;flex-direction:column;height:100%;flex:none;min-width:0}
#sideHead{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;font-weight:700;color:var(--head);box-shadow:0 1px 0 #0003;cursor:pointer;gap:8px}
#sideHead span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#sideList{flex:1;overflow-y:auto;padding:8px}
.cat{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 4px 6px;font-size:12px;font-weight:700;text-transform:uppercase;color:var(--mut)}
.cat button:hover{color:var(--head)}
.ch{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:4px;color:var(--mut);cursor:pointer;margin:1px 0;min-height:34px;position:relative}
.ch:hover{background:var(--hov);color:var(--txt)}.ch.on{background:var(--bg4);color:var(--head)}.ch.unread{color:var(--head);font-weight:600}
.ch .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.ch .gear{opacity:0;color:var(--mut)}.ch:hover .gear,.ch.on .gear{opacity:1}
.ch .cnt{background:var(--dnd);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:0 5px;min-width:16px;text-align:center}
.vu{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 30px;font-size:13px;color:var(--mut)}
.vu .av{width:22px;height:22px;font-size:10px}.vu svg{margin-left:auto;color:var(--dnd)}
#voiceBar{background:var(--bg0);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px}
#voiceBar b{color:var(--ok);font-size:13px;display:block}#voiceBar small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;cursor:pointer}
#panel{height:56px;background:#232428;flex:none;display:flex;align-items:center;padding:0 8px;gap:4px;padding-bottom:0}
[data-theme=light] #panel{background:var(--bg0)}
#panelU{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;border-radius:4px;padding:3px}
#panelU:hover{background:var(--bg3)}#panelU div.t{min-width:0;line-height:1.15}#panelU b{display:block;font-size:13px;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#panelU small{font-size:11px;color:var(--mut)}
.ib{width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.ib:hover{background:var(--bg3);color:var(--txt)}.ib.alert{color:var(--dnd)}
.av{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av i{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg1);background:var(--off)}
.av i.online{background:var(--ok)}.av i.idle{background:var(--idle)}.av i.dnd{background:var(--dnd)}
#main{flex:1;min-width:0;background:var(--bg2);display:flex;flex-direction:column;height:100%;position:relative}
#head{height:48px;flex:none;display:flex;align-items:center;padding:0 8px 0 14px;gap:8px;box-shadow:0 1px 0 #0003;z-index:2;background:var(--bg2)}
#head .ti{font-weight:700;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
#head .top{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--bg4);padding-left:10px;flex:1;min-width:0}
#head .sp{flex:1}.back{display:none!important}
#conn{background:var(--idle);color:#222;text-align:center;font-size:13px;font-weight:600;padding:3px;flex:none}
#conn.bad{background:var(--dnd);color:#fff}
#body{flex:1;display:flex;min-height:0}
#center{flex:1;min-width:0;display:flex;flex-direction:column}
#msgs{flex:1;overflow-y:auto;padding:12px 0 4px;overflow-anchor:none;-webkit-overflow-scrolling:touch}
#welcome{padding:20px 16px}#welcome h2{color:var(--head);margin:8px 0 2px;font-size:26px}#welcome p{color:var(--mut);margin:0}
.wico{width:64px;height:64px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--head)}
.m{position:relative;padding:1px 56px 1px 72px;min-height:22px;word-wrap:break-word;overflow-wrap:anywhere}
.m:hover{background:#0000000d}[data-theme=light] .m:hover{background:#0000000a}
.m.first{margin-top:14px}.m .av{position:absolute;left:16px;top:2px;width:40px;height:40px;cursor:pointer;font-size:16px}
.m .hdr{display:flex;align-items:baseline;gap:8px}.m .nm{font-weight:600;color:var(--head);cursor:pointer}.m .nm:hover{text-decoration:underline}
.m .ts{font-size:11px;color:var(--mut)}
.m .hts{position:absolute;left:0;width:64px;text-align:right;top:4px;font-size:10px;color:var(--mut);opacity:0}.m:hover .hts{opacity:1}
.m.ment{background:var(--ment);box-shadow:inset 2px 0 var(--idle)}
.m.pend .tx{opacity:.55}.m.fail .tx{color:var(--dnd)}
.m.flash{animation:fl 1.4s}@keyframes fl{0%,60%{background:#5865f255}}
.retry{color:var(--dnd);font-size:12px;cursor:pointer;text-decoration:underline}
.tx{white-space:pre-wrap}.ed{font-size:10px;color:var(--mut)}
.tx code{background:var(--bg0);padding:1px 4px;border-radius:3px;font:13px Consolas,Menlo,monospace}.tx pre{background:var(--bg0);padding:8px;border-radius:4px;margin:4px 0;overflow:auto;font:13px Consolas,Menlo,monospace;white-space:pre-wrap}
.tx .mn{background:#5865f24d;color:#c9cdfb;border-radius:3px;padding:0 2px;font-weight:500}[data-theme=light] .tx .mn{color:var(--acc2)}
.spo{background:var(--bg0);color:transparent;border-radius:3px;cursor:pointer}.spo.op{background:var(--bg4);color:inherit}
blockquote{margin:2px 0;border-left:4px solid var(--bg4);padding-left:8px}
.rp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);cursor:pointer;overflow:hidden;white-space:nowrap;margin-bottom:1px}
.rp b{color:var(--txt);font-weight:600}.rp span{overflow:hidden;text-overflow:ellipsis}
.att img{max-width:min(400px,100%);max-height:320px;border-radius:6px;display:block;margin:4px 0;cursor:zoom-in}.att audio{display:block;margin:4px 0;max-width:100%;height:40px}
.file{display:inline-flex;gap:10px;align-items:center;background:var(--bg1);border:1px solid var(--line);border-radius:6px;padding:10px;margin:4px 0;max-width:100%}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}.rx button{background:var(--bg1);border:1px solid transparent;border-radius:6px;padding:1px 7px;font-size:13px;color:var(--mut);min-height:24px}.rx button.me{background:var(--ment);border-color:var(--acc);color:var(--head)}.rx button:hover{border-color:var(--mut)}
.tools{position:absolute;right:16px;top:-14px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;display:none;box-shadow:0 2px 8px #0003;z-index:3}
.m:hover .tools{display:flex}.tools button{width:32px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--mut)}.tools button:hover{background:var(--bg3);color:var(--txt)}
.sysm{padding:6px 16px 6px 72px;color:var(--mut);font-size:14px;position:relative}.sysm svg{position:absolute;left:30px;top:8px;color:var(--ok)}
.day{display:flex;align-items:center;gap:8px;margin:18px 16px 4px;color:var(--mut);font-size:12px;font-weight:600}.day:before,.day:after{content:"";flex:1;height:1px;background:var(--bg4)}
#typing{height:22px;padding:0 16px;font-size:12px;color:var(--mut);flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#typing b{color:var(--txt)}
#comp{padding:0 16px calc(2px + env(safe-area-inset-bottom));flex:none;position:relative}
#compBar{background:var(--bg1);border-radius:8px 8px 0 0;padding:6px 12px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
#compBar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#compIn{background:var(--bg3);border-radius:8px;display:flex;align-items:flex-end;padding:2px 6px}
#compBar:not(.hidden)+#compIn{border-radius:0 0 8px 8px}
#inp{min-height:42px;flex:1;background:none;border:0;outline:0;resize:none;padding:10px 6px;max-height:160px;min-width:0;line-height:1.35;font-size:16px}
#compIn .ib{width:38px;height:40px}
#rec{color:var(--dnd);font-weight:600;font-size:13px;padding:11px 6px;flex:1}
#ac{position:absolute;left:16px;right:16px;bottom:100%;background:var(--bg1);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;padding:6px;z-index:5}
#ac div{display:flex;align-items:center;gap:8px;padding:6px;border-radius:4px;cursor:pointer}#ac div:hover,#ac div.on{background:var(--bg4)}#ac .av{width:24px;height:24px;font-size:10px}
#members{width:240px;background:var(--bg1);overflow-y:auto;padding:8px;flex:none}
.mem{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:4px;cursor:pointer}.mem:hover{background:var(--hov)}.mem.offl{opacity:.45}
.mem span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--txt);min-width:0}
.cr{color:var(--idle);font-size:12px;flex:none}
/* home */
#home{flex:1;overflow:auto;padding:0 20px 20px;min-height:0}
.tabs{display:flex;gap:6px;margin-left:6px;min-width:0}.mtabs{display:none}.tab{white-space:nowrap;padding:3px 10px;border-radius:4px;color:var(--mut);font-weight:500}.tab:hover{background:var(--hov)}.tab.on{background:var(--bg4);color:var(--head)}.tab.add{background:var(--ok);color:#fff}.tab.add.on{background:none;color:var(--ok)}
.fr{display:flex;align-items:center;gap:10px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}.fr:hover{background:var(--hov)}.fr .t{flex:1;min-width:0}.fr b{color:var(--head);display:block}.fr small{color:var(--mut)}
.fr .ib{background:var(--bg1);border-radius:50%;width:36px;height:36px}
.emp{text-align:center;color:var(--mut);padding:40px 16px}
/* stage */
#stage{background:#000;display:flex;flex-direction:column;min-height:0;position:relative;flex:none;height:45%;color:#fff}
#stage.full{flex:1;height:auto}
#tiles{flex:1;display:grid;gap:8px;padding:10px;min-height:0;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));grid-auto-rows:minmax(100px,1fr);overflow:auto}
.tile{position:relative;background:#232428;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100px;outline:0 solid var(--ok);outline-offset:-3px;cursor:pointer}
.tile.speaking{outline-width:3px}.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.tile.self video.cam{transform:scaleX(-1)}
.tile.focus{position:fixed;inset:0;z-index:40;border-radius:0}
.tile .av{width:72px;height:72px;font-size:28px}
.tile .lab{position:absolute;left:8px;bottom:8px;background:#000a;border-radius:4px;padding:2px 7px;font-size:13px;display:flex;gap:5px;align-items:center;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden}
.tile .st{position:absolute;right:8px;top:8px;background:#000a;font-size:11px;padding:2px 6px;border-radius:4px}
#callSt{text-align:center;padding:8px 10px 0;font-weight:600;font-size:14px;color:var(--idle);flex:none}#callSt.ok{color:var(--ok)}#callSt.bad{color:#ff8a8d}
#ctl{display:flex;justify-content:center;gap:10px;padding:10px;flex:none;flex-wrap:wrap}
.cb{width:50px;height:50px;border-radius:50%;background:#2b2d31;color:#fff;display:flex;align-items:center;justify-content:center}.cb:hover{background:#404249}.cb.on{background:#fff;color:#000}.cb.off{background:var(--dnd)}.cb.end{background:var(--dnd);width:64px;border-radius:25px}
#joinScr{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:20px}
/* modal */
#ov{position:fixed;inset:0;z-index:30;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
.mod{background:var(--bg2);border-radius:8px;width:100%;max-width:460px;max-height:90vh;max-height:90dvh;overflow:auto;padding:20px;box-shadow:var(--shadow);position:relative}
.mod h2{margin:0 0 6px;color:var(--head);font-size:20px}.mod p{color:var(--mut);margin:0 0 8px}
.modB{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.x{position:absolute;right:10px;top:10px;color:var(--mut);width:32px;height:32px;font-size:20px}
.mod.wide{max-width:760px;width:100%;padding:0;display:flex;height:min(620px,90dvh);overflow:hidden}
.setN{width:180px;background:var(--bg1);padding:14px 8px;flex:none;overflow:auto}.setN button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:4px;color:var(--mut)}.setN button:hover{background:var(--hov)}.setN button.on{background:var(--bg4);color:var(--head)}
.setB{flex:1;padding:20px;overflow:auto;min-width:0}
.sheet{display:flex;flex-direction:column}.sheet button{padding:12px;text-align:left;border-radius:6px;font-size:16px}.sheet button:hover{background:var(--hov)}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px}.emo button{font-size:24px;height:42px;border-radius:4px}.emo button:hover{background:var(--bg4)}
.pop .ban{height:60px;border-radius:8px 8px 0 0;margin:-20px -20px 0}.pop .av{width:80px;height:80px;font-size:32px;margin-top:-40px;border:6px solid var(--bg2);box-sizing:content-box}
.row{display:flex;gap:8px;align-items:center}
.code{font:13px Consolas,monospace;background:var(--bg0);padding:10px;border-radius:4px;word-break:break-all;user-select:all}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,460px);pointer-events:none}
.toast{background:#111214;color:#fff;border-radius:6px;padding:9px 14px;box-shadow:var(--shadow);font-size:14px}.toast.bad{background:var(--dnd)}
#ring{position:fixed;z-index:45;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px}
#ring .card{text-align:center;max-width:320px}#ring .av{width:96px;height:96px;font-size:38px;margin-bottom:12px;animation:pu 1.2s infinite}@keyframes pu{50%{box-shadow:0 0 0 12px #23a55a44}}
#audioBox{display:none}
#viewer{position:fixed;inset:0;background:#000e;z-index:55;display:flex;align-items:center;justify-content:center;padding:10px}#viewer img{max-width:100%;max-height:100%}
#scrim{display:none}
@media(max-width:1100px){#members{display:none}body[data-pane=members] #members{display:block}}
@media(max-width:768px){
  #app{display:block;position:relative;overflow:hidden}
  #nav{position:absolute;inset:env(safe-area-inset-top) 0 0 0;height:auto;width:100%;z-index:1}
  #side{flex:1;width:auto}
  #main{position:absolute;inset:env(safe-area-inset-top) 0 0 0;height:auto;z-index:2;transition:transform .2s ease;transform:translateX(100%);will-change:transform}
  body[data-pane=chat] #main,body[data-pane=members] #main{transform:none}
  .back{display:flex!important}
  #members{position:absolute;top:48px;right:0;bottom:0;width:80%;max-width:300px;z-index:6;box-shadow:var(--shadow)}
  body[data-pane=members] #scrim{display:block;position:absolute;inset:48px 0 0 0;background:#0007;z-index:5}
  .m{padding:1px 12px 1px 60px}.m .av{left:10px;width:38px;height:38px}.m .hts{display:none}.m:hover .tools{display:none}.sysm{padding-left:60px}.sysm svg{left:20px}
  #head .tabs:not(.mtabs){display:none}.mtabs{display:grid;grid-template-columns:auto auto 1fr 1fr;gap:4px;margin:0 -6px;padding:8px 0;position:sticky;top:0;background:var(--bg2);z-index:1}.mtabs .tab{padding:8px 4px;min-height:38px;font-size:14px;text-align:center;overflow:hidden;text-overflow:ellipsis}.mtabs .tab:nth-child(1),.mtabs .tab:nth-child(2){padding:8px 10px}#home{padding:0 12px 16px}#addF{flex-wrap:wrap}#addF .btn{width:100%}
  #comp{padding-left:8px;padding-right:8px}#head .top{display:none}#head .sp{flex:1}
  #stage{height:42%}.cb{width:46px;height:46px}

async function compress(file,side,limit){if(/^image\/(png|jpeg|webp|gif)$/.test(file.type)&&file.size<=limit*.9&&file.size>0){const d=await blobData(file);const dim=await new Promise(r=>{const i=new Image;i.onload=()=>r(Math.max(i.width,i.height));i.onerror=()=>r(0);i.src=d});if(dim&&dim<=side)return d}
  const bmp=await new Promise((res,rej)=>{const i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});let s=Math.min(1,side/Math.max(bmp.width,bmp.height));for(let tries=0;tries<8;tries++){const c=document.createElement('canvas');c.width=Math.max(1,bmp.width*s|0);c.height=Math.max(1,bmp.height*s|0);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);for(const q of[.8,.6,.45]){const u=c.toDataURL('image/jpeg',q);if(u.length*.75<=limit)return u}s*=.75}throw new Error('too big')}
const blobData=b=>new Promise((r,j)=>{const f=new FileReader;f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});
async function sendFile(f){const c=curConv();if(!c)return;try{if(f.type.startsWith('image/')&&f.type!=='image/svg+xml'){const data=await compress(f,1280,MAX_ATT);sendMsg(c,{att:{k:'img',name:f.name,data}})}else{if(f.size>MAX_ATT)return toast(`Файл больше ${MAX_ATT/1024} КБ. Сервера без своего хранилища большие файлы не передают`,1);const u=new Uint8Array(await f.arrayBuffer());sendMsg(c,{att:{k:'file',name:f.name,size:f.size,data:'data:application/octet-stream;base64,'+b64(u)}})}}catch{toast('Не удалось подготовить файл',1)}}

async function recToggle(){if(recS){recS.stop();return}const c=curConv();if(!c)return;if(!window.MediaRecorder)return toast('Браузер не умеет записывать голос',1);let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return toast('Нет доступа к микрофону',1)}const mt=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t));const r=new MediaRecorder(st,{...(mt?{mimeType:mt}:{}),audioBitsPerSecond:12000}),ch=[];let sec=0;recS=r;$('#inp').classList.add('hidden');$('#rec').classList.remove('hidden');$('#bEmo').classList.add('hidden');$('#bAtt').classList.add('hidden');$('#bRec').innerHTML=ic('stop',20);const up=()=>$('#rec').textContent=`● Запись ${sec} с — нажмите стоп`;up();const iv=setInterval(()=>{sec++;up();if(sec>=50)r.stop()},1000);
  r.ondataavailable=e=>ch.push(e.data);r.onstop=async()=>{clearInterval(iv);st.getTracks().forEach(t=>t.stop());recS=null;$('#inp').classList.remove('hidden');$('#rec').classList.add('hidden');$('#bEmo').classList.remove('hidden');$('#bAtt').classList.remove('hidden');$('#bRec').innerHTML=ic('mic',20);const b=new Blob(ch,{type:(r.mimeType||'audio/webm').split(';')[0]});if(b.size>MAX_ATT)return toast('Запись слишком большая',1);if(sec<1)return;sendMsg(c,{att:{k:'voice',data:await blobData(b)}})};r.start()}

async function testBroker(url){const topic=NS+'/dbg/'+rid(8),got={};const stub={filters:new Map([[topic,1]]),will:null,state(){},incoming(c,t,p){got[p.length]=Date.now()}};const t0=Date.now(),c=new Conn(url,stub);const host=url.replace(/^wss?:\/\//,'').split('/')[0];const fin=m=>{c.stop();return host+': '+m};
  while(!c.up&&Date.now()-t0<9000)await sleep(100);if(!c.up)return fin('✗ нет подключения');const con=Date.now()-t0;await sleep(300);
  const trip=async(n)=>{const t=Date.now(),ok=await c.publish(topic,'x'.repeat(n),1,false);if(!ok)return null;const ack=Date.now()-t;while(!got[n]&&Date.now()-t<8000)await sleep(50);return got[n]?got[n]-t:-ack};
  const a=await trip(200);if(a===null)return fin(`подключение ${con} мс; ✗ нет ответа на сообщение`);if(a<0)return fin(`подключение ${con} мс; отправка есть; ✗ приём не работает`);
  const b=await trip(40000);if(b===null||b<0)return fin(`подключение ${con} мс; сообщение ${a} мс; ✗ большой пакет завис`);return fin(`✓ подключение ${con} мс; сообщение ${a} мс; большой пакет ${b} мс`)}
async function iceDiag(){const pc=new RTCPeerConnection(await iceCfg()),n={host:0,srflx:0,relay:0};pc.createDataChannel('t');await new Promise(res=>{const to=setTimeout(res,9000);pc.onicecandidate=e=>{if(!e.candidate){clearTimeout(to);res();return}const m=/ typ (\w+)/.exec(e.candidate.candidate);if(m&&m[1]in n)n[m[1]]++};pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(res)});pc.close();return`Звонки: локальных ${n.host}, STUN ${n.srflx}, TURN ${n.relay}${n.srflx?'':' — ✗ STUN недоступен'}${n.relay?'':' — ✗ TURN недоступен'}`}
async function netDiag(){const rows=await Promise.all(brokers().map(u=>testBroker(u).catch(e=>u+': ошибка '+e.message)));const ok=rows.filter(r=>r.includes('✓')).length,ice=window.RTCPeerConnection?await iceDiag():'Звонки: браузер не поддерживает';return`Рабочих серверов: ${ok} из ${rows.length}\n${rows.join('\n')}\n${ice}\n${navigator.onLine?'':'Устройство офлайн\n'}`}

  try{window.SozvonApp?.incomingCall(uName(c.dm))}catch{}
  if(!window.SozvonApp&&document.hidden&&'Notification'in window&&Notification.permission==='granted')try{new Notification('Входящий звонок',{body:uName(c.dm),tag:'call'})}catch{}
