name: Сборка APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Создать проект
        run: |
          set -e
          html="$(ls *.html | head -n 1)"
          test -n "$html"
          mkdir -p src/main/java/app/sozvon src/main/assets src/main/res/drawable
          cp "$html" src/main/assets/sozvon.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          rootProject.name = 'sozvon'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'app.sozvon'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.sozvon'
                  minSdk 24
                  targetSdk 34
                  versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              signingConfigs { main { storeFile file('app.jks'); storePassword 'sozvon123'; keyAlias 'sozvon'; keyPassword 'sozvon123' } }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.main } }
              lint { checkReleaseBuilds false; abortOnError false }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          repositories { google(); mavenCentral() }
          EOF
          cat > src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.microphone" android:required="false"/>
              <application android:label="Созвон" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar" android:hardwareAccelerated="true" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:windowSoftInputMode="adjustResize" android:configChanges="orientation|screenSize|screenLayout|keyboard|keyboardHidden|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeepAliveService" android:exported="false" android:stopWithTask="true" android:foregroundServiceType="specialUse|microphone">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="messenger"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#5865F2" android:pathData="M0,0h24v24h-24z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M6,7.5a2,2 0 0,1 2,-2h8a2,2 0 0,1 2,2v6a2,2 0 0,1 -2,2h-3.5l-3.5,3.5v-3.5h-1a2,2 0 0,1 -2,-2zM9,9v2.5h1.5V9zM13.5,9v2.5H15V9z"/>
          </vector>
          EOF
          cat > src/main/java/app/sozvon/MainActivity.java <<'EOF'
          package app.sozvon;

          import android.Manifest;
          import android.app.Activity;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private static final int REQ_PERMS = 1, REQ_FILE = 2;
              private WebView web;
              private PermissionRequest pending;
              private ValueCallback<Uri[]> fileCb;
              private boolean fg = true;

              private Notification.Builder builder(String ch) {
                  Notification.Builder n;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      nm.createNotificationChannel(new NotificationChannel("calls", "Звонки", NotificationManager.IMPORTANCE_HIGH));
                      nm.createNotificationChannel(new NotificationChannel("messages", "Сообщения", NotificationManager.IMPORTANCE_DEFAULT));
                      n = new Notification.Builder(this, ch);
                  } else n = new Notification.Builder(this);
                  Intent i = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  return n.setSmallIcon(R.drawable.ic_launcher).setContentIntent(pi);
              }

              private void startKeep(boolean inCall) {
                  try {
                      Intent svc = new Intent(this, KeepAliveService.class).putExtra("call", inCall);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc); else startService(svc);
                  } catch (Exception ignored) { }
              }

              private PendingIntent ringIntent(String action, int code) {
                  Intent i = new Intent(this, MainActivity.class).setAction(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  return PendingIntent.getActivity(this, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private void showRing(String name) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("ring", "Входящие звонки", NotificationManager.IMPORTANCE_HIGH);
                      ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE), new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE).build());
                      ch.enableVibration(true);
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(ch);
                      b = new Notification.Builder(this, "ring").setTimeoutAfter(50000);
                  } else {
                      b = new Notification.Builder(this).setPriority(Notification.PRIORITY_MAX).setDefaults(Notification.DEFAULT_ALL);
                  }
                  Icon ic = Icon.createWithResource(this, R.drawable.ic_launcher);
                  nm.notify(2, b.setSmallIcon(ic).setContentTitle(name).setContentText("Входящий звонок").setCategory(Notification.CATEGORY_CALL)
                      .setOngoing(true).setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setContentIntent(ringIntent("open", 10)).setFullScreenIntent(ringIntent("open", 10), true)
                      .addAction(new Notification.Action.Builder(ic, "Сбросить", ringIntent("decline", 11)).build())
                      .addAction(new Notification.Action.Builder(ic, "Принять", ringIntent("accept", 12)).build()).build());
              }

              private void handleAction(Intent i) {
                  if (i == null || i.getAction() == null) return;
                  String a = i.getAction();
                  getSystemService(NotificationManager.class).cancel(2);
                  if ("accept".equals(a) || "decline".equals(a)) web.evaluateJavascript("answerRing(" + "accept".equals(a) + ")", null);
              }

              @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); setIntent(i); handleAction(i); }
              @Override protected void onStart() { super.onStart(); fg = true; getSystemService(NotificationManager.class).cancel(2); }

              public class Bridge {
                  @JavascriptInterface public void incomingCall(String name) { runOnUiThread(() -> { if (!fg) showRing(name); }); }
                  @JavascriptInterface public void callState(boolean on) { runOnUiThread(() -> startKeep(on)); }
                  @JavascriptInterface public void callEnded() { getSystemService(NotificationManager.class).cancel(2); }
                  @JavascriptInterface public void message(String title, String body) {
                      if (fg) return;
                      getSystemService(NotificationManager.class).notify(3, builder("messages").setContentTitle(title).setContentText(body).setAutoCancel(true).build());
                  }
              }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 3);
                  try {
                      Intent svc = new Intent(this, KeepAliveService.class);
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc); else startService(svc);
                  } catch (Exception ignored) { }
                  web = new WebView(this);
                  if (Build.VERSION.SDK_INT >= 26) web.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);
                  web.addJavascriptInterface(new Bridge(), "SozvonApp");
                  setContentView(web);
                  web.setBackgroundColor(0xFF1E1F22);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  web.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          if (!HOST.equals(r.getUrl().getHost())) return null;
                          try {
                              return new WebResourceResponse("text/html", "UTF-8", getAssets().open("sozvon.html"));
                          } catch (IOException e) { return null; }
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          if (HOST.equals(r.getUrl().getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, r.getUrl())); } catch (Exception ignored) { }
                          return true;
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(PermissionRequest r) { handleMedia(r); }
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try { startActivityForResult(p.createIntent(), REQ_FILE); return true; }
                          catch (Exception e) { fileCb = null; return false; }
                      }
                  });
                  web.setDownloadListener((url, ua, cd, mime, len) -> saveData(url));
                  web.loadUrl("https://" + HOST + "/");
                  handleAction(getIntent());
              }

              private void handleMedia(PermissionRequest r) {
                  List<String> need = new ArrayList<>();
                  for (String res : r.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.RECORD_AUDIO);
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.CAMERA);
                  }
                  if (need.isEmpty()) { grant(r); return; }
                  pending = r;
                  requestPermissions(need.toArray(new String[0]), REQ_PERMS);
              }

              private void grant(PermissionRequest r) {
                  List<String> ok = new ArrayList<>();
                  for (String res : r.getResources()) {
                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) { ok.add(res); callAudio(true); }
                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) && checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) ok.add(res);
                  }
                  if (ok.isEmpty()) r.deny(); else r.grant(ok.toArray(new String[0]));
              }

              private void callAudio(boolean on) {
                  AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  am.setMode(on ? AudioManager.MODE_IN_COMMUNICATION : AudioManager.MODE_NORMAL);
                  am.setSpeakerphoneOn(on);
              }

              @Override public void onRequestPermissionsResult(int c, String[] p, int[] g) {
                  if (c == REQ_PERMS && pending != null) { grant(pending); pending = null; }
              }

              @Override protected void onActivityResult(int c, int res, Intent d) {
                  if (c == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, d));
                      fileCb = null;
                  }
              }

              private void saveData(String url) {
                  try {
                      if (!url.startsWith("data:")) { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); return; }
                      byte[] data = Base64.decode(url.substring(url.indexOf(',') + 1), Base64.DEFAULT);
                      String name = "sozvon_" + System.currentTimeMillis();
                      OutputStream out;
                      if (Build.VERSION.SDK_INT >= 29) {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream");
                          out = getContentResolver().openOutputStream(getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v));
                      } else {
                          out = new FileOutputStream(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), name));
                      }
                      out.write(data);
                      out.close();
                      Toast.makeText(this, "Файл сохранён в «Загрузки»: " + name, Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось сохранить файл", Toast.LENGTH_LONG).show();
                  }
              }

              @Override public void onBackPressed() {
                  web.evaluateJavascript("(function(){var o=document.getElementById('ov');if(o&&!o.classList.contains('hidden')){closeModal();return 1}var a=document.getElementById('app'),b=document.body;if(!a.classList.contains('hidden')&&b.dataset.pane!=='nav'){b.dataset.pane='nav';return 1}return 0})()",
                      r -> { if (!"1".equals(r)) moveTaskToBack(true); });
              }

              @Override protected void onStop() { super.onStop(); fg = false; }
              @Override protected void onResume() { super.onResume(); fg = true; getSystemService(NotificationManager.class).cancel(3); }
              @Override protected void onDestroy() { stopService(new Intent(this, KeepAliveService.class)); callAudio(false); web.destroy(); super.onDestroy(); }
          }
          EOF
          cat > src/main/java/app/sozvon/KeepAliveService.java <<'EOF'
          package app.sozvon;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.content.pm.ServiceInfo;

          public class KeepAliveService extends Service {
              @Override public int onStartCommand(Intent intent, int flags, int id) {
                  Notificati
